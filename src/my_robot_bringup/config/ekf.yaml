# Ref: http://docs.ros.org/en/noetic/api/robot_localization/html/state_estimation_nodes.html

## ekf config file ###
/**/ekf_filter_node:
    ros__parameters:
        frequency: 20.0
        sensor_timeout: 0.05
        two_d_mode: true

        transform_time_offset: 0.0
        transform_timeout: 0.05

        map_frame: map
        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom
        publish_tf: true
        publish_acceleration: false

        odom0: /diff_drive_controller/odom
        odom0_config: [false, false, false, # X , Y , Z
                      false, false, true,  # roll , pitch , yaw  ← absolute heading from wheels
                      true, false, false,  # dX , dY , dZ
                      false, false, false, # droll , dpitch , dyaw (IMU owns this)
                      false, false, false] # ddX , ddY , ddZ

        odom0_queue_size: 2
        odom0_nodelay: true
        odom0_differential: false
        odom0_relative: false

        imu0: /imu_broadcaster/imu
        imu0_config: [false, false, false,
              false, false, false, # Set yaw to false
              false, false, false,
              false, false, true,  # Keep angular velocity z (dyaw) as true
              false, false, false]
        imu0_queue_size: 5
        imu0_nodelay: true
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: true

